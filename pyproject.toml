[project]
name = "m365-data-generator"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1.5,<4",
  "tzdata>=2025.1",
  "Pillow>=11.1,<13",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]
live = ["playwright>=1.55,<2"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
